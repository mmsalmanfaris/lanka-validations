name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Fails when an exported function, class, type, or constant has no TSDoc comment.
      - run: npm run docs

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Installs the packed tarball into a fresh project and imports every entry point (ESM + CJS).
      - run: npm run check:package

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails when coverage drops below the thresholds in vitest.config.mts.
      - run: npm run test:coverage
      - name: Write coverage summary
        if: always()
        run: |
          node -e "
            const { total } = require('./coverage/coverage-summary.json');
            const rows = ['statements', 'branches', 'functions', 'lines']
              .map((k) => '| ' + k + ' | ' + total[k].pct + '% | ' + total[k].covered + '/' + total[k].total + ' |');
            console.log(['## Coverage', '', '| Metric | % | Covered |', '| --- | --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  package:
    name: Package lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # publint: package.json/exports rules. attw: type resolution for node10, node16 (CJS/ESM) and bundlers.
      - run: npm run lint:package
      # Fails when a minified + brotli entry point grows past its budget in .size-limit.json.
      - run: npx size-limit
